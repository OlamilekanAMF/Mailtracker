<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mailtrack</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #697386;
      --line: #e8ebf2;
      --surface: #fff;
      --canvas: #f5f7fb;
      --brand: #5b5bd6;
      --brand-soft: #ededff;
      --green: #16865b;
      --green-soft: #e7f7ef;
      --amber: #9a6700;
      --amber-soft: #fff4d6;
      --red: #b42318;
      --red-soft: #feeceb;
    }
    * { box-sizing: border-box; }
    body {
      width: 460px;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 9px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--brand);
      color: #fff;
      box-shadow: 0 4px 12px rgba(91, 91, 214, .22);
    }
    .brand-mark svg { width: 16px; height: 16px; }
    h1 { margin: 0; font-size: 15px; line-height: 1; letter-spacing: -.01em; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn, .text-btn {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
    }
    .icon-btn { display: grid; width: 32px; place-items: center; padding: 0; }
    .icon-btn svg { width: 15px; height: 15px; }
    .icon-btn:hover, .text-btn:hover { border-color: #ccd2df; color: var(--ink); background: #fafbfe; }
    .icon-btn.loading svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .text-btn { display: inline-flex; align-items: center; padding: 0 9px; text-decoration: none; }
    main { padding: 12px 12px 10px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .stat-label { color: var(--muted); font-size: 11px; }
    .stat-value { margin-top: 2px; font-size: 21px; line-height: 1.1; font-weight: 750; letter-spacing: -.03em; }
    .stat-value.brand { color: var(--brand); }
    .stat-value.green { color: var(--green); }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .search { position: relative; flex: 1; }
    .search svg {
      position: absolute;
      left: 9px;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translateY(-50%);
      color: #929aaa;
      pointer-events: none;
    }
    .search input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      padding: 0 10px 0 30px;
      color: var(--ink);
      outline: none;
    }
    .search input:focus { border-color: #aaaaf0; box-shadow: 0 0 0 3px var(--brand-soft); }
    .scope {
      display: flex;
      align-items: center;
      height: 34px;
      gap: 6px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
      font-size: 12px;
    }
    .scope input { accent-color: var(--brand); margin: 0; }
    .filters {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter {
      height: 28px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      padding: 0 9px;
      white-space: nowrap;
    }
    .filter.active { background: var(--brand-soft); color: #41419f; font-weight: 700; }
    #msg {
      display: none;
      margin: 2px 0;
      padding: 28px 18px;
      border: 1px dashed #dfe3ec;
      border-radius: 10px;
      background: rgba(255,255,255,.7);
      color: var(--muted);
      text-align: center;
    }
    #list { max-height: 390px; overflow-y: auto; }
    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb { background: #d7dbe5; border-radius: 6px; }
    .row {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 9px;
      margin-bottom: 7px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .row:hover { border-color: #d7dbea; transform: translateY(-1px); box-shadow: 0 5px 14px rgba(31, 42, 68, .05); }
    .avatar {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #f0f1f7;
      color: #60697a;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .avatar.gmail { background: #feeceb; color: var(--red); }
    .avatar.outlook { background: #e8f1ff; color: #1f66b1; }
    .avatar.zoho { background: #fff0d5; color: var(--amber); }
    .avatar.yahoo { background: #eeeaff; color: #6941c6; }
    .content { min-width: 0; }
    .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .subj { overflow: hidden; min-width: 0; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 750; }
    .time { flex: 0 0 auto; color: #929aaa; font-size: 10px; }
    .meta { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .badges { display: flex; gap: 5px; margin-top: 7px; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      border-radius: 6px;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 700;
      background: #f1f3f7;
      color: #60697a;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.sent { background: var(--green-soft); color: var(--green); }
    .badge.read { background: var(--brand-soft); color: #4a4ab1; }
    .badge.unread { background: #f1f3f7; color: #6b7280; }
    .badge.warn { background: var(--amber-soft); color: var(--amber); }
    .badge.failed { background: var(--red-soft); color: var(--red); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 5.5h16v13H4z" /><path d="m4 7 8 6 8-6" />
        </svg>
      </div>
      <h1>Mailtrack</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refresh" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
        </svg>
      </button>
      <button class="text-btn" id="opts">Settings</button>
    </div>
  </header>
  <main>
    <section class="summary" aria-label="Tracking summary">
      <div class="stat"><div class="stat-label">Tracked</div><div class="stat-value" id="totalCount">0</div></div>
      <div class="stat"><div class="stat-label">Read</div><div class="stat-value green" id="readCount">0</div></div>
      <div class="stat"><div class="stat-label">Open rate</div><div class="stat-value brand" id="openRate">0%</div></div>
    </section>
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <input id="search" type="search" placeholder="Search emails..." aria-label="Search emails" />
      </div>
      <label class="scope"><input type="checkbox" id="all" /> Everyone</label>
    </div>
    <nav class="filters" aria-label="Email filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="read">Read</button>
      <button class="filter" data-filter="unread">Unread</button>
      <button class="filter" data-filter="sent">Sent</button>
      <button class="filter" data-filter="pending">Pending</button>
    </nav>
    <div id="msg">Loading…</div>
    <div id="list"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
