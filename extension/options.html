<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mailtrack settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #1a1a1a; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    small { display: block; color: #666; font-weight: 400; margin-top: 2px; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 8px 16px; cursor: pointer; }
    #status { margin-top: 12px; color: #176b2c; }
    #err { color: #a32020; }
  </style>
</head>
<body>
  <h1>Mailtrack settings</h1>

  <label>Backend URL
    <small>Must be public https, e.g. https://mailtrack.onrender.com (no trailing slash needed)</small>
    <input type="text" id="serverUrl" placeholder="https://your-backend.example.com" />
  </label>

  <label>API key
    <small>The same value as API_KEY on the backend</small>
    <input type="password" id="apiKey" />
  </label>

  <label>Your email address
    <small>Used to show only your own emails in the popup</small>
    <input type="text" id="owner" placeholder="you@example.com" />
  </label>

  <label><input type="checkbox" id="enabled" checked /> Tracking enabled</label>

  <button id="save">Save</button>
  <button id="test">Test connection</button>
  <div id="status"></div>
  <div id="err"></div>
  <script src="options.js"></script>
</body>
</html>
